name: firmware

on:
  push:
    branches:
      - 'master'
    tags:
      - 'fw-v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # the release image: bluetooth and wi-fi on the rm2
          - variant: bt
            cmake-args: -DENABLE_BLUETOOTH_HID=ON
          # without the radio stack: must still compile
          - variant: nobt
            cmake-args: -DENABLE_BLUETOOTH_HID=OFF
          # 1.3" sh1106 oled module
          - variant: bt-sh1106
            cmake-args: -DENABLE_BLUETOOTH_HID=ON -DDISPLAY_CONTROLLER=DISPLAY_SH1106

    steps:
      - name: Additional dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc-arm-none-eabi

      - name: Get the source
        # recursive: the bluetooth builds need pico-sdk's own lib/btstack and
        # lib/cyw43-driver submodules, not just pico-sdk itself
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure
        # a fw-v* tag builds the release of that number; anything else is "dev"
        run: |
          if test "${{ github.ref_type }}" = "tag"; then version="${GITHUB_REF_NAME#fw-v}"; else version=dev; fi
          cmake -S firmware -B build -DCMAKE_BUILD_TYPE=Release -DNINEPIN_VERSION="$version" ${{ matrix.cmake-args }}

      - name: Build
        run: cmake --build build

      - name: Collect
        run: |
          if test "${{ github.ref_type }}" = "tag"; then id="${{ github.ref_name }}"; else id="${GITHUB_SHA::7}"; fi
          mkdir -p out
          cp -v build/src/ninepin-ux.uf2 "out/ninepin-ux-${{ matrix.variant }}-${id}.uf2"
          cp -v build/src/ninepin-ux.elf "out/ninepin-ux-${{ matrix.variant }}-${id}.elf"
          cp -v build/src/partition-table.uf2 out/partition-table.uf2

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ninepin-ux-${{ matrix.variant }}
          path: out/

  release:
    # a fw-v* tag publishes the release image: the bluetooth build and the partition table
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ninepin-ux-bt
          path: bt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp bt/ninepin-ux-bt-${{ github.ref_name }}.uf2 ninepin-ux.uf2
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "Ninepin UX firmware ${{ github.ref_name }}" --generate-notes \
            ninepin-ux.uf2 bt/partition-table.uf2
